version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: storshoes-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: storshoes_db
      POSTGRES_USER: storshoes
      POSTGRES_PASSWORD: storshoes_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storshoes -d storshoes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
